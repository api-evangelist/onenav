name: oneNav
description: 'oneNav is a fabless GNSS (Global Navigation Satellite System) semiconductor
  company building the next generation of mobile positioning. Its L5-direct receiver
  acquires and tracks on the modern L5 satellite band without legacy L1 aiding, delivering
  higher location accuracy in urban canyons and far greater resilience to GPS jamming
  and spoofing, in half the RF size, power and cost of hybrid L1+L5 solutions. Founded
  in 2019 (Steve Poizner, Paul McBurney) with offices in Sunnyvale, CA and Tampere,
  Finland, oneNav targets smartphones, wearables, IoT trackers, defense and emergency
  services. It is backed by GV, Norwest Venture Partners and GSR Ventures. oneNav is
  a hardware/silicon company and does not publish a public developer API, OpenAPI, or
  developer portal.'
